# Reference training hyperparameters used in our experiments.
# Adapt optimization and loss settings to your model, data and resources.
# Keep architecture settings consistent with the selected training stage.
stage: stage1
epochs: 3
lr: 0.0001
group_batch: 2
weight_decay: 0.01
invariance_weight: 0.03
counterfactual_weight: 0.03
authority_weight: 0.1
margin_weight: 0.1
margin_slack: 1.0
adversarial_weight: 1.0
adversarial_invariance_weight: 0.03
gradient_checkpointing: true
model:
  base_model: /path/to/model
  local_files_only: true
  rank: 8
  dropout: 0.05
  beta_max: 8.0
  context_mix: 1.0
  centered_residual: true
  protected: false
  interaction: false
  max_tokens: 1536
  control_tokens: ["<|fim_prefix|>", "<|fim_middle|>", "<|fim_suffix|>"]
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
